<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binaire et Couleur</title>

<style>
body{
  font-family: Arial;
  background:#0f172a;
  margin:0;
  color:white;
}

header{
  text-align:center;
  padding:15px;
  background:#1e293b;
}

.container{
  max-width:600px;
  margin:auto;
  padding:20px;
}

.card{
  background:#111827;
  margin-bottom:10px;
  padding:12px;
  border-radius:10px;
  cursor:pointer;
}

.content{
  display:none;
  margin-top:10px;
  font-family: monospace;
  color:#00ff99;
}

.colorBox{
  width:100%;
  height:50px;
  border-radius:8px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
🎨 Binaire & Couleurs (RGB)
</header>

<div class="container">

<div class="card" onclick="toggle('c1')">
🔴 Rouge (RGB + Binaire)
<div class="content" id="c1">
RGB : (255,0,0)
<br>
Binaire : 11111111 00000000 00000000
<div class="colorBox" style="background:red;"></div>
</div>
</div>

<div class="card" onclick="toggle('c2')">
🟢 Vert
<div class="content" id="c2">
RGB : (0,255,0)
<br>
Binaire : 00000000 11111111 00000000
<div class="colorBox" style="background:green;"></div>
</div>
</div>

<div class="card" onclick="toggle('c3')">
🔵 Bleu
<div class="content" id="c3">
RGB : (0,0,255)
<br>
Binaire : 00000000 00000000 11111111
<div class="colorBox" style="background:blue;"></div>
</div>
</div>

<div class="card" onclick="toggle('c4')">
🟡 Jaune
<div class="content" id="c4">
RGB : (255,255,0)
<br>
Binaire : 11111111 11111111 00000000
<div class="colorBox" style="background:yellow;"></div>
</div>
</div>

</div>

<script>
function toggle(id){
  let x = document.getElementById(id);
  x.style.display = (x.style.display === "block") ? "none" : "block";
}
</script>

</body>
</html>
