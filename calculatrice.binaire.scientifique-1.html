<!DOCTYPE html><html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculatrice Scientifique</title>
<style>
body {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #667eea, #764ba2);
  font-family: Arial;
}
.calculator {
  background: #222;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}
#display {
  width: 100%;
  height: 60px;
  font-size: 24px;
  margin-bottom: 10px;
  text-align: right;
  padding: 10px;
  border-radius: 10px;
  border: none;
}
.buttons {
  display: grid;
  grid-template-columns: repeat(5, 60px);
  gap: 10px;
}
button {
  height: 50px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  background: #444;
  color: white;
}
button:hover {
  background: #666;
}
.equal {
  background: #28a745;
}
.clear {
  background: #dc3545;
}
</style>
</head>
<body>
<div class="calculator">
  <input type="text" id="display" disabled>
  <div class="buttons">
    <button onclick="clearDisplay()" class="clear">C</button>
    <button onclick="append('(')">(</button>
    <button onclick="append(')')">)</button>
    <button onclick="append('/')">/</button>
    <button onclick="append('*')">*</button><button onclick="append('7')">7</button>
<button onclick="append('8')">8</button>
<button onclick="append('9')">9</button>
<button onclick="append('-')">-</button>
<button onclick="append('Math.sqrt(')">√</button>

<button onclick="append('4')">4</button>
<button onclick="append('5')">5</button>
<button onclick="append('6')">6</button>
<button onclick="append('+')">+</button>
<button onclick="append('Math.pow(')">x²</button>

<button onclick="append('1')">1</button>
<button onclick="append('2')">2</button>
<button onclick="append('3')">3</button>
<button onclick="calculate()" class="equal">=</button>
<button onclick="append('Math.PI')">π</button>

<button onclick="append('0')">0</button>
<button onclick="append('.')">.</button>
<button onclick="append('Math.sin(')">sin</button>
<button onclick="append('Math.cos(')">cos</button>
<button onclick="append('Math.tan(')">tan</button>

<button onclick="append('Math.log(')">log</button>
<button onclick="append('Math.exp(')">exp</button>
<button onclick="append('Math.pow(,')">xʸ</button>

  </div>
</div><script>
function append(value) {
  document.getElementById("display").value += value;
}

function clearDisplay() {
  document.getElementById("display").value = "";
}

function calculate() {
  try {
    document.getElementById("display").value = eval(document.getElementById("display").value);
  } catch {
    alert("Erreur");
  }
}
</script></body>
</html>
