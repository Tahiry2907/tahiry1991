<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:"Segoe UI", Arial, sans-serif;
    background:
        linear-gradient(135deg,#eef7ef,#f4f7fb);
    color:#263238;
    min-height:100vh;
}


/* =====================================================
   HEADER
===================================================== */

header{
    background:
        linear-gradient(135deg,#1b5e20,#2e7d32,#43a047);
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    position:sticky;
    top:0;
    z-index:1000;
    box-shadow:0 4px 15px rgba(0,0,0,.20);
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo h2{
    font-size:22px;
}

.lang{
    display:flex;
    gap:7px;
}

.lang button{
    background:white;
    color:#1b5e20;
    border:none;
    padding:8px 14px;
    border-radius:20px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.lang button:hover{
    background:#c8e6c9;
    transform:translateY(-2px);
}

.lang button.active{
    background:#ffca28;
    color:#263238;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:92%;
    max-width:1100px;
    margin:30px auto;
}


/* =====================================================
   PROGRESS
===================================================== */

.progress-box{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
    margin-bottom:25px;
}

.progress-info{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-weight:bold;
    color:#2e7d32;
}

.progress{
    width:100%;
    height:12px;
    background:#e0e0e0;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0;
    background:
        linear-gradient(90deg,#2e7d32,#66bb6a);
    border-radius:20px;
    transition:.5s;
}


/* =====================================================
   CARD
===================================================== */

.card{
    background:white;
    padding:30px;
    margin-bottom:25px;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(0,0,0,.09);
    border-left:6px solid #2e7d32;
    animation:fadeIn .5s ease;
    min-height:300px;
}

.card h2{
    color:#2e7d32;
    margin-bottom:20px;
    font-size:28px;
}

.card h3{
    color:#388e3c;
    margin:20px 0 10px;
}

.card p{
    line-height:1.8;
    margin:12px 0;
    font-size:16px;
}

.card ul{
    margin:15px 0 15px 25px;
}

.card li{
    margin:10px 0;
    line-height:1.6;
}


/* =====================================================
   FORMULE
===================================================== */

.formule{
    background:#e8f5e9;
    border-left:5px solid #2e7d32;
    padding:15px;
    margin:15px 0;
    border-radius:10px;
    font-family:Consolas,monospace;
    font-size:17px;
    color:#1b5e20;
    font-weight:bold;
}


/* =====================================================
   TABLEAU
===================================================== */

.excel-table{
    width:100%;
    border-collapse:collapse;
    margin:20px 0;
}

.excel-table th,
.excel-table td{
    border:1px solid #cfd8dc;
    padding:12px;
    text-align:left;
}

.excel-table th{
    background:#2e7d32;
    color:white;
}

.excel-table tr:nth-child(even){
    background:#f1f8f2;
}


/* =====================================================
   NAVIGATION
===================================================== */

.nav{
    display:flex;
    justify-content:space-between;
    gap:15px;
    margin:20px 0;
}

.nav button{
    flex:1;
    max-width:200px;
    background:#2e7d32;
    color:white;
    border:none;
    padding:13px 20px;
    border-radius:10px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    transition:.3s;
}

.nav button:hover{
    background:#1b5e20;
    transform:translateY(-2px);
}

.nav button:disabled{
    background:#bdbdbd;
    cursor:not-allowed;
    transform:none;
}


/* =====================================================
   QUIZ
===================================================== */

.quiz-question{
    background:#f1f8e9;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
}

.quiz-btn{
    background:#2e7d32;
    color:white;
    border:none;
    padding:12px 20px;
    margin:7px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:.3s;
}

.quiz-btn:hover{
    background:#1b5e20;
    transform:scale(1.04);
}

.correct{
    color:#2e7d32;
    font-weight:bold;
    margin-top:15px;
}

.wrong{
    color:#d32f2f;
    font-weight:bold;
    margin-top:15px;
}

.score{
    margin-top:20px;
    padding:15px;
    background:#e8f5e9;
    border-radius:10px;
    font-weight:bold;
}


/* =====================================================
   LIENS DES COURS
===================================================== */

.lesson-links{
    margin-top:30px;
}

.lesson-links h2{
    color:#2e7d32;
    margin-bottom:20px;
}

.boutton{
    margin:12px 0;
}

.button{
    display:block;
    text-decoration:none;
    background:
        linear-gradient(135deg,#2e7d32,#43a047);
    color:white;
    padding:14px 18px;
    border-radius:10px;
    font-weight:bold;
    transition:.3s;
    box-shadow:0 4px 10px rgba(46,125,50,.20);
}

.button:hover{
    transform:translateX(6px);
    box-shadow:0 7px 18px rgba(46,125,50,.30);
}


/* =====================================================
   TOP BUTTON
===================================================== */

#topBtn{
    position:fixed;
    right:20px;
    bottom:20px;
    width:45px;
    height:45px;
    border:none;
    border-radius:50%;
    background:#2e7d32;
    color:white;
    font-size:20px;
    cursor:pointer;
    display:none;
    z-index:999;
    box-shadow:0 5px 15px rgba(0,0,0,.25);
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    margin-top:40px;
    background:#1b5e20;
    color:white;
    text-align:center;
    padding:25px 15px;
}

footer p{
    margin:7px;
}

.date{
    opacity:.8;
    font-size:14px;
}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(15px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    header{
        padding:15px;
        flex-direction:column;
        text-align:center;
    }

    .logo h2{

    }

        width:94%;

    }

        padding:20px;
        border-left:4px solid #2e7d32;
    }

        font-size:23px;
    }

    .card p,
    .card li{
        font-size:15px;
    }

    .nav{
        flex-direction:row;
    }

    .nav button{
        padding:11px;
    }

    .excel-table{
        font-size:13px;
    }

    .excel-table th,
    .excel-table td{
        padding:8px;
    }
}

</style>
</head>

/* =====================================================
   AFFICHER LEÇON
===================================================== */

function show(){

    document.getElementById("content").innerHTML =
        lessons[step][lang];

    updateProgress();

    updateButtons();

    updateLanguageButtons();

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* =====================================================
   PROGRESSION
===================================================== */

function updateProgress(){

    const total = lessons.length;

    const current = step + 1;

    const percent =
        (current / total) * 100;

    document.getElementById("progressBar")
        .style.width = percent + "%";

    document.getElementById("stepText")
        .textContent =
        current + " / " + total;

    if(lang === "fr"){

        document.getElementById("progressText")
            .textContent = "Progression";

    }else{

        document.getElementById("progressText")
            .textContent = "Fandrosoana";
    }
}


/* =====================================================
   BOUTONS PREV / NEXT
===================================================== */

function updateButtons(){

    document.getElementById("prevBtn").disabled =
        step === 0;

    document.getElementById("nextBtn").disabled =
        step === lessons.length - 1;

    if(lang === "fr"){

        document.getElementById("prevBtn")
            .innerHTML = "⬅️ Précédent";

        document.getElementById("nextBtn")
            .innerHTML = "Suivant ➡️";

    }else{

        document.getElementById("prevBtn")
            .innerHTML = "⬅️ Taloha";

        document.getElementById("nextBtn")
            .innerHTML = "Manaraka ➡️";
    }
}


/* =====================================================
   SUIVANT
===================================================== */

function next(){

    if(step < lessons.length - 1){

        step++;

        show();
    }
}


/* =====================================================
   PRECEDENT
===================================================== */

function prev(){

    if(step > 0){

        step--;

        show();
    }
}


/* =====================================================
   LANGUE
===================================================== */

function setLang(l){

    lang = l;

    localStorage.setItem(
        "excelLang",
        lang
    );

    show();
}


/* =====================================================
   BOUTONS LANGUE
===================================================== */

function updateLanguageButtons(){

    document
        .getElementById("frBtn")
        .classList.toggle(
            "active",
            lang === "fr"
        );

    document
        .getElementById("mlBtn")
        .classList.toggle(
            "active",
            lang === "ml"
        );

    if(lang === "fr"){

        document.getElementById("title")
            .textContent =
            "Formation Excel Pro";

        document.getElementById("linksTitle")
            .textContent =
            "📚 Cours pratiques Excel";

        document.getElementById("footerText")
            .textContent =
            "Formation Excel Pro";

    }else{

        document.getElementById("title")
            .textContent =
            "Formation Excel Pro";

        document.getElementById("linksTitle")
            .textContent =
            "📚 Lesona Excel azo ampiharina";

        document.getElementById("footerText")
            .textContent =
            "Formation Excel Pro";
    }
}


/* =====================================================
   QUIZ
===================================================== */

function answer(correct){

    const res =
        document.getElementById("res");

    if(!res) return;

    if(correct){

        score++;

        res.className = "correct";

        res.innerHTML =
            lang === "fr"
            ? "✔️ Bonne réponse !"
            : "✔️ Marina ny valiny !";

    }else{

        res.className = "wrong";

        res.innerHTML =
            lang === "fr"
            ? "❌ Mauvaise réponse."
            : "❌ Diso ny valiny.";
    }

    const scoreValue =
        document.getElementById("scoreValue");

    if(scoreValue){

        scoreValue.textContent = score;
    }
}


/* =====================================================
   DATE
===================================================== */

function showDate(){

    const now = new Date();

    const options = {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
    };

    document.getElementById("date")
        .textContent =
        now.toLocaleDateString(
            "fr-FR",
            options
        );
}


/* =====================================================
   BOUTON TOP
===================================================== */

window.addEventListener("scroll",function(){

    const btn =
        document.getElementById("topBtn");

    if(window.scrollY > 300){

        btn.style.display = "block";

    }else{

        btn.style.display = "none";
    }

});


/* =====================================================
   INITIALISATION
===================================================== */

show();

showDate();

</script>
