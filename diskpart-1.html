<h2>1️⃣ Qu’est-ce que Diskpart ?</h2>
<p>Diskpart est un outil puissant de gestion des disques sous Windows. 
Il permet de gérer les disques, partitions et volumes.</p>

<h2>2️⃣ Lancer Diskpart</h2>
<pre>diskpart</pre>

<h2>3️⃣ Commandes principales</h2>
<ul>
<li>list disk : affiche les disques</li>
<li>select disk X : sélectionne un disque</li>
<li>list partition : affiche les partitions</li>
<li>select partition X</li>
<li>create partition primary</li>
<li>delete partition</li>
<li>format fs=fat32 quick</li>
<li>assign : donne une lettre</li>
<li>exit</li>
</ul>

<h2>4️⃣ Exemple complet (clé USB)</h2>
<pre>
diskpart
list disk
select disk 1
clean
create partition primary
format fs=fat32 quick
assign
exit
</pre>

<h2>5️⃣ Commandes avancées</h2>
<ul>
<li>attributes disk clear readonly</li>
<li>shrink : réduire partition</li>
<li>extend : agrandir partition</li>
<li>active : rendre bootable</li>
</ul>

<h2>6️⃣ Remarques importantes</h2>
<ul>
<li>Très puissant ⚠️</li>
<li>clean supprime tout définitivement</li>
<li>toujours vérifier le disque sélectionné</li>
</ul>
`,
