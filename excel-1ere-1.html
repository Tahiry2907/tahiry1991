<body>

<header>
<h2>📊 Excel 1ère (Expert)</h2>
<div class="lang">
<button onclick="setLang('fr')">FR</button>
<button onclick="setLang('ml')">ML</button>
</div>
</header>

<div class="container">

<div class="card" id="content"></div>

<div class="nav">
<button onclick="prev()">⬅️</button>
<button onclick="next()">➡️</button>
</div>

</div>

<script>
  

let lang="fr";
let step=0;

const lessons=[

// 1
{
fr:`<h2>Tableau croisé dynamique</h2>
<p>Permet d’analyser rapidement des milliers de données.</p>
<ul>
<li>Insertion → Tableau croisé dynamique</li>
<li>Choisir champs</li>
</ul>`,

ml:`<h2>Tableau croisé dynamique</h2>
<p>Famakafakana données betsaka haingana.</p>`
},

// 2
{
fr:`<h2>Fonction RECHERCHEX (moderne)</h2>
<p>Remplace RECHERCHEV.</p>`,

ml:`<h2>RECHERCHEX</h2>
<p>Version vaovao RECHERCHEV.</p>`
},

// 3
{
fr:`<h2>Analyse de données</h2>
<p>Utiliser filtres, graphiques et tableaux pour interpréter les résultats.</p>`,

ml:`<h2>Analyse données</h2>
<p>Famakafakana sy fanapahan-kevitra.</p>`
},

// 4
{
fr:`<h2>Dashboard Excel</h2>
<p>Créer un tableau de bord avec graphiques et indicateurs.</p>`,

ml:`<h2>Dashboard</h2>
<p>Tableau misy graphique sy indicateur.</p>`
},

// 5
{
fr:`<h2>Automatisation</h2>
<p>Utiliser formules pour automatiser calculs.</p>`,

ml:`<h2>Automatisation</h2>
<p>Manamora asa automatique.</p>`
},

// 6
{
fr:`<h2>Projet réel</h2>
<p>Créer un système complet :</p>
<ul>
<li>Notes élèves</li>
<li>Moyenne automatique</li>
<li>Graphique</li>
</ul>`,

ml:`<h2>Projet tena izy</h2>
<p>Gestion notes sy moyenne automatique.</p>`
},

// 7
{
fr:`<h2>Interprétation</h2>
<p>Comprendre les résultats pour prendre décision.</p>`,

ml:`<h2>Interpretation</h2>
<p>Mahatakatra résultats.</p>`
},

// QUIZ
{
fr:`<h2>Quiz</h2>
<p>Tableau croisé dynamique sert à :</p>
<button onclick="answer(true)">Analyser données</button>
<button onclick="answer(false)">Jouer</button>
<p id="res"></p>`,

ml:`<h2>Quiz</h2>
<p>Tableau croisé dynamique dia:</p>
<button onclick="answer(true)">Analyse données</button>
<button onclick="answer(false)">Milalao</button>
<p id="res"></p>`
}

];

function show(){
document.getElementById("content").innerHTML=lessons[step][lang];
}

function next(){ if(step<lessons.length-1){step++;show();}}
function prev(){ if(step>0){step--;show();}}

function setLang(l){ lang=l; show(); }

function answer(correct){
document.getElementById("res").innerHTML= correct ? "✔️ Marina" : "❌ Diso";
}

show();

</script>
