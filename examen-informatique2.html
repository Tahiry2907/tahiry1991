/* =====================================================
   GENERAL
===================================================== */

*{
    box-sizing:border-box;
}

body{
    margin:0;

    background:

            #073b4c,

}


/* =====================================================
   HEADER
===================================================== */

header{
    background:
        linear-gradient(
            135deg,
            #03152b,
            #007c91
        );

    color:white;
    padding:25px 15px;
    text-align:center;

    box-shadow:

}

header h1{
    margin:0;
    font-size:28px;
}

header p{
    margin:8px 0 0;
}


/* =====================================================
   CONTAINER
===================================================== */

.container{
    width:min(1100px,94%);
    margin:25px auto;
}


/* =====================================================
   CONTROLS
===================================================== */

.control{
    background:#ffffffee;
    border-radius:18px;
    padding:20px;

    box-shadow:
        0 8px 30px #0004;

    margin-bottom:20px;
}

.controls{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);

    gap:15px;
}

label{
    font-weight:bold;
    display:block;
    margin-bottom:6px;
}

select{
    width:100%;
    padding:12px;

    border:
        2px solid #cbd5e1;

    border-radius:10px;

    font-size:15px;

    background:white;
}


/* =====================================================
   BUTTONS
===================================================== */

.buttons{
    display:flex;
    flex-wrap:wrap;

    gap:10px;

    margin-top:18px;
}

button{
    border:0;

    padding:
        12px 16px;

    border-radius:10px;

    cursor:pointer;

    font-weight:bold;

    color:white;

    background:#007c91;

    transition:
        .2s;
}

button:hover{
    transform:
        translateY(-2px);

    opacity:.9;
}

.btn-print{
    background:#2563eb;
}

.btn-show{
    background:#16a34a;
}

.btn-hide{
    background:#dc2626;
}

.btn-reset{
    background:#6b7280;
}


/* =====================================================
   EXAM
===================================================== */

.exam{
    background:white;

    border-radius:20px;

    padding:30px;

    box-shadow:
        0 10px 35px #0005;
}


/* =====================================================
   EXAM HEADER
===================================================== */

.exam-head{
    border-bottom:
        3px solid #007c91;

    padding-bottom:18px;

    margin-bottom:20px;
}

.exam-head h2{
    color:#006d77;

    margin-top:0;
}


/* =====================================================
   INFORMATION
===================================================== */

.info-grid{
    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:10px;
}

.info{
    background:#eef8fa;

    padding:12px;

    border-radius:10px;

    font-weight:bold;
}


/* =====================================================
   SECTIONS
===================================================== */

.section{
    margin-top:25px;
}

.section h3{
    background:
        linear-gradient(
            90deg,
            #006d77,
            #00a6a6
        );

    color:white;

    padding:12px;

    border-radius:10px;
}


/* =====================================================
   QUESTIONS
===================================================== */

.question{
    background:#f8fafc;

    border-left:
        5px solid #007c91;

    padding:15px;

    margin:12px 0;

    border-radius:8px;
}

.question strong{
    color:#006d77;
}


/* =====================================================
   PRACTICAL
===================================================== */

.pratique{
    background:#eff6ff;

    border-left:
        5px solid #2563eb;

    padding:15px;

    margin:12px 0;

    border-radius:8px;
}


/* =====================================================
   BARÈME
===================================================== */

.bareme{
    background:#fff7ed;

    border-left:
        5px solid #f97316;

    padding:12px;

    margin-top:10px;

    border-radius:8px;
}


/* =====================================================
   CORRECTION
===================================================== */

/*
   IMPORTANT :
   Le corrigé est caché au départ.
*/

.corrige{
    display:none !important;

    background:#ecfdf5;

    border-left:
        5px solid #16a34a;

    padding:15px;

    margin-top:25px;

    border-radius:8px;
}


/*
   Cette classe est ajoutée
   quand on clique sur Afficher corrigé.
*/

.corrige.visible{
    display:block !important;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{
    text-align:center;

    color:white;

    padding:25px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:800px){

    .controls,
    .info-grid{
        grid-template-columns:1fr;
    }

    .exam{
        padding:18px;
    }

    header h1{
        font-size:23px;
    }

}


/* =====================================================
   PRINT
===================================================== */

@media print{

    body{
        background:white;
    }

    header,
    .control,
    .footer{
        display:none !important;
    }

    .container{
        width:100%;
        margin:0;
    }

    .exam{
        box-shadow:none;
        border-radius:0;
    }

    /*
       Le corrigé reste caché
       lors de l'impression du sujet.
    */

    .corrige{
        display:none !important;
    }

}

</style>

/* =====================================================
   AFFICHER LE SUJET
===================================================== */

function afficherSujet(){

    const classe =
        document.getElementById("classe").value;

    const trim =
        document.getElementById("trim").value;

    const evaluation =
        document.getElementById("evaluation").value;


    const cle =
        classe +
        "-" +
        trim +
        "-" +
        evaluation;


    const sujet =
        sujets[cle];


    const zone =
        document.getElementById("exam");


    if(!sujet){

        zone.innerHTML = `

        <div class="question">

        <h2>⚠️ Sujet non disponible</h2>

        <p>
        Ce sujet n'est pas encore enregistré.
        </p>

        </div>

        `;

        return;
    }


    let html = `

    <div class="exam-head">

        <h2>
        ${sujet.titre}
        </h2>


        <div class="info-grid">

            <div class="info">

                Classe :
                ${
                    document
                    .getElementById("classe")
                    .selectedOptions[0]
                    .text
                }

            </div>


            <div class="info">

                Trimestre :
                ${
                    document
                    .getElementById("trim")
                    .selectedOptions[0]
                    .text
                }

            </div>


            <div class="info">

                Évaluation :
                ${
                    document
                    .getElementById("evaluation")
                    .selectedOptions[0]
                    .text
                }

            </div>


            <div class="info">

                Durée :
                1h30

            </div>

        </div>


        <br>


        <strong>

        Théorie : /20

        &nbsp; | &nbsp;

        Pratique : /20

        &nbsp; | &nbsp;

        TOTAL : /40

        &nbsp; | &nbsp;

        DURÉE : 1H30

        </strong>

    </div>


    <!-- THEORIE -->

    <div class="section">

        <h3>
        📘 PARTIE A — THÉORIE /20
        </h3>
    `;


    sujet.theorie.forEach(
        (q,index)=>{

            html += `

            <div class="question">

                <strong>
                ${q[0]}
                </strong>

                <div class="bareme">

                Barème :
                ${q[1]} point(s)

                </div>

            </div>

            `;

        }
    );


    html += `

    </div>


    <!-- PRATIQUE -->

    <div class="section">

        <h3>
        💻 PARTIE B — PRATIQUE /20
        </h3>
    `;


    sujet.pratique.forEach(
        (q,index)=>{

            html += `

            <div class="pratique">

                <strong>
                ${q[0]}
                </strong>

                <div class="bareme">

                Barème :
                ${q[1]} point(s)

                </div>

            </div>

            `;

        }
    );


    /*
       IMPORTANT :
       Le bouton Afficher corrigé
       cherche cet ID.
    */

    html += `

    </div>


    <!-- CORRIGE -->

    <div
        id="correction"
        class="section corrige"
    >

        <h3>
        ✅ CORRIGÉ DÉTAILLÉ
        </h3>

    `;


    sujet.corrige.forEach(
        (rep,index)=>{

            html += `

            <div class="question">

                <strong>
                Réponse ${index+1}
                </strong>

                <p>
                ${rep}
                </p>

            </div>

            `;

        }
    );


    html += `

        <div class="bareme">

            <strong>
            📊 BARÈME GÉNÉRAL
            </strong>

            <br><br>

            Théorie :
            <strong>20 points</strong>

            <br>

            Pratique :
            <strong>20 points</strong>

            <br>

            Total :
            <strong>40 points</strong>

            <br><br>

            Durée :
            <strong>1h30 — 90 minutes</strong>

        </div>


    </div>

    `;


    zone.innerHTML = html;


    /*
       IMPORTANT :
       Après changement de sujet,
       le corrigé est toujours caché.
    */

}


/* =====================================================
   AFFICHER LE CORRIGÉ
===================================================== */

function afficherCorrige(){

    const correction =
        document.getElementById("correction");


    if(!correction){

        alert(
            "⚠️ Le corrigé n'a pas été trouvé."
        );

        return;
    }


    /*
       On ajoute la classe visible.
       !important dans le CSS garantit
       que le corrigé apparaît.
    */

    correction.classList.add("visible");


    /*
       Faire descendre automatiquement
       vers le corrigé.
    */

    setTimeout(function(){

        correction.scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

    },100);

}


/* =====================================================
   CACHER LE CORRIGÉ
===================================================== */

function cacherCorrige(){

    const correction =
        document.getElementById("correction");


    if(!correction){

        return;
    }


    correction.classList.remove("visible");


    /*
       Retour vers le début du sujet.
    */

    document
        .getElementById("exam")
        .scrollIntoView({

            behavior:"smooth",

            block:"start"

        });

}


/* =====================================================
   REINITIALISER
===================================================== */

function reinitialiser(){

    document
        .getElementById("classe")
        .value =
        "6eme";


    document
        .getElementById("trim")
        .value =
        "1";


    document
        .getElementById("evaluation")
        .value =
        "DS";


    afficherSujet();

}


/* =====================================================
   LANCEMENT INITIAL
===================================================== */

afficherSujet();
