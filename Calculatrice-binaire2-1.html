<div class="calc">
  <input type="text" id="screen" readonly>
  <br>
  <button onclick="press('0')">0</button>
  <button onclick="press('1')">1</button>
  <button onclick="press('+')">+</button>
  <button onclick="press('-')">-</button>
  <button onclick="calc()">=</button>
  <button onclick="clearScreen()">C</button>
</div>

<script>
let input = '';
function press(val){
  input += val;
  document.getElementById('screen').value = input;
}

function clearScreen(){
  input = '';
  document.getElementById('screen').value = '';
}

function calc(){
  // Diviser la chaîne en opérateur et nombres
  let match = input.match(/([01]+)([+\-×÷])([01]+)/);
  if(match){
    let a = parseInt(match[1],2);
    let b = parseInt(match[3],2);
    let op = match[2];
    let res;
    if(op=='+') res=a+b;
    if(op=='-') res=a-b;
    if(op=='×') res=a*b;
    if(op=='÷') res=Math.floor(a/b);
    document.getElementById('screen').value = res.toString(2);
    input = '';
  }
}
</script>
