function afficherListe(){

    const liste=document.getElementById("liste");
    liste.innerHTML="";

    exercices.forEach(ex=>{

        const card=document.createElement("div");
        card.className="card";
        card.dataset.niveau=ex.niveau;
        card.dataset.texte=(ex.titre+" "+ex.formules).toLowerCase();

        card.innerHTML=`
            <span class="badge">EXERCICE ${String(ex.id).padStart(2,"0")}</span>
            <h3>${ex.titre}</h3>
            <p>${ex.formules}</p>
            <button onclick="ouvrirExercice(${ex.id})">
                📖 Ouvrir l'exercice
            </button>
        `;

        liste.appendChild(card);
    });
}

function filtrer(){

    const recherche=document
        .getElementById("recherche")
        .value
        .toLowerCase();

    const niveau=document
        .getElementById("niveau")
        .value;

    document.querySelectorAll(".card").forEach(card=>{

        const okRecherche=
            card.dataset.texte.includes(recherche);

        const okNiveau=
            niveau==="tous" ||
            card.dataset.niveau===niveau;

        card.style.display=
            okRecherche && okNiveau
            ?"block"
            :"none";
    });
}

let exerciceActuel=null;

function ouvrirExercice(id){

    exerciceActuel=exercices.find(e=>e.id===id);

    document.getElementById("zoneExercice").style.display="block";

    document.getElementById("titreExercice").textContent=
        exerciceActuel.titre;

    document.getElementById("consigne").textContent=
        exerciceActuel.consigne;

    construireTableau();

    document.getElementById("corrige").style.display="none";

    window.scrollTo({
        top:document.getElementById("zoneExercice").offsetTop-20,
        behavior:"smooth"
    });
}

function construireTableau(){

    const table=document.getElementById("tableau");
    table.innerHTML="";

    const thead=document.createElement("thead");
    const tr=document.createElement("tr");

    exerciceActuel.colonnes.forEach(col=>{
        const th=document.createElement("th");
        th.textContent=col;
        tr.appendChild(th);
    });

    thead.appendChild(tr);
    table.appendChild(thead);

    const tbody=document.createElement("tbody");

    exerciceActuel.data.forEach((ligne,r)=>{

        const tr=document.createElement("tr");

        ligne.forEach((val,c)=>{

            const td=document.createElement("td");

            td.textContent=val;

            if(
                val==="" ||
                c>=2
            ){
                td.contentEditable="true";
            }

            tr.appendChild(td);
        });

        tbody.appendChild(tr);
    });

    table.appendChild(tbody);
}

    const rows=document.querySelectorAll("#tableau tbody tr");

    rows.forEach(row=>{

        const cells=row.querySelectorAll("td");

        const title=exerciceActuel.id;

        if(title===1){

            const prix=parseFloat(cells[2].textContent)||0;
            const qte=parseFloat(cells[3].textContent)||0;

            const total=prix*qte;
            const remise=qte>=20 ? total*0.05 : 0;
            const net=total-remise;

            cells[4].textContent=total.toFixed(0);
            cells[5].textContent=remise.toFixed(0);
            cells[6].textContent=net.toFixed(0);
        }

        if(title===2){

            const qte=parseFloat(cells[2].textContent)||0;
            const prix=parseFloat(cells[3].textContent)||0;

            const ca=qte*prix;
            const commission=ca>=1000000 ? ca*.05 : ca*.02;
            const observation=ca>=500000
                ?"Objectif atteint"
                :"À améliorer";

            cells[4].textContent=ca.toFixed(0);
            cells[5].textContent=commission.toFixed(0);
            cells[6].textContent=observation;
        }

        if(title===3){

            const prix=parseFloat(cells[3].textContent)||0;
            const qte=parseFloat(cells[4].textContent)||0;

            cells[5].textContent=(prix*qte).toFixed(0);

            cells[6].textContent=
                cells[2].textContent==="À réparer"
                ?"Maintenance nécessaire"
                :"OK";
        }

        if(title===4){

            const prix=parseFloat(cells[2].textContent)||0;
            const qte=parseFloat(cells[3].textContent)||0;

            const total=prix*qte;
            const tva=total*.10;

            cells[4].textContent=total.toFixed(0);
            cells[5].textContent=tva.toFixed(0);
            cells[6].textContent=(total+tva).toFixed(0);
        }

        if(title===5){

            const distance=parseFloat(cells[1].textContent)||0;
            const prix=parseFloat(cells[2].textContent)||0;
            const carburant=parseFloat(cells[3].textContent)||0;

            const recette=distance*prix;
            const benefice=recette-carburant;

            cells[4].textContent=recette.toFixed(0);
            cells[5].textContent=benefice.toFixed(0);
            cells[6].textContent=
                benefice>=200000
                ?"Rentable"
                :"À améliorer";
        }

        if(title===6){

            const initial=parseFloat(cells[1].textContent)||0;
            const entrees=parseFloat(cells[2].textContent)||0;
            const sorties=parseFloat(cells[3].textContent)||0;
            const seuil=parseFloat(cells[5].textContent)||0;

            const stock=initial+entrees-sorties;

            cells[4].textContent=stock;
            cells[6].textContent=
                stock<=seuil
                ?"Commander"
                :"Stock suffisant";
        }

        if(title===8){

            const conso=parseFloat(cells[1].textContent)||0;
            const prix=parseFloat(cells[2].textContent)||0;

            cells[3].textContent=(conso*prix).toFixed(0);
        }

        if(title===9){

            const forfait=parseFloat(cells[2].textContent)||0;
            const conso=parseFloat(cells[3].textContent)||0;

            const facture=forfait+conso;
            const reduction=facture>100000
                ?facture*.10
                :0;

            cells[4].textContent=facture.toFixed(0);
            cells[5].textContent=reduction.toFixed(0);
            cells[6].textContent=(facture-reduction).toFixed(0);
        }

        if(title===10){

            const arrivee=new Date(cells[1].textContent);
            const depart=new Date(cells[2].textContent);

            const nuits=Math.round(
                (depart-arrivee)/(1000*60*60*24)
            );

            const prix=parseFloat(cells[3].textContent)||0;
            const total=nuits*prix;
            const reduction=nuits>=5?total*.10:0;

            cells[4].textContent=nuits;
            cells[5].textContent=total.toFixed(0);
            cells[6].textContent=reduction.toFixed(0);
            cells[7].textContent=(total-reduction).toFixed(0);
        }

        if(title===13){

            const prix=parseFloat(cells[1].textContent)||0;
            const qte=parseFloat(cells[2].textContent)||0;
            const budget=parseFloat(cells[4].textContent)||0;

            const cout=prix*qte;

            cells[3].textContent=cout.toFixed(0);
            cells[5].textContent=
                cout>budget
                ?"Budget dépassé"
                :"Budget respecté";
        }

        if(title===15){

            const initial=parseFloat(cells[1].textContent)||0;
            const entrees=parseFloat(cells[2].textContent)||0;
            const ventes=parseFloat(cells[3].textContent)||0;
            const seuil=parseFloat(cells[5].textContent)||0;

            const stock=initial+entrees-ventes;

            cells[4].textContent=stock;
            cells[6].textContent=
                stock<=seuil
                ?"Stock faible"
                :"OK";
        }

        if(title===16){

            const victoire=parseFloat(cells[1].textContent)||0;
            const nul=parseFloat(cells[2].textContent)||0;

            cells[4].textContent=
                victoire*3+nul;
        }

        if(title===18){

            const prevu=parseFloat(cells[1].textContent)||0;
            const reel=parseFloat(cells[2].textContent)||0;

            const rendement=
                prevu ? reel/prevu*100 : 0;

            cells[3].textContent=
                rendement.toFixed(2)+" %";

            cells[4].textContent=
                rendement>=90
                ?"Bon rendement"
                :"À améliorer";
        }

        if(title===20){

            const prix=parseFloat(cells[2].textContent)||0;
            const qte=parseFloat(cells[3].textContent)||0;

            const total=prix*qte;
            const remise=qte>=20 ? total*.05 : 0;
            const net=total-remise;

            cells[4].textContent=total.toFixed(0);
            cells[5].textContent=remise.toFixed(0);
            cells[6].textContent=net.toFixed(0);

            cells[7].textContent=
                qte>=20
                ?"Grande quantité"
                :"Quantité normale";
        }

    });

    alert("✅ Calcul terminé !");
}

function sauvegarder(){

    if(!exerciceActuel)return;

    localStorage.setItem(
        "InfoPro_Excel_Exercice_"+exerciceActuel.id,
        document.getElementById("tableau").outerHTML
    );

    alert("💾 Exercice enregistré dans le stockage !");
}

function charger(){

    if(!exerciceActuel)return;

    const sauvegarde=
        localStorage.getItem(
            "InfoPro_Excel_Exercice_"+exerciceActuel.id
        );

    if(!sauvegarde){

        alert("ℹ️ Aucun exercice enregistré.");
        return;
    }

    document.getElementById("tableau").outerHTML=
        sauvegarde;

    alert("📂 Exercice chargé !");
}

function afficherCorrige(){

    const zone=document.getElementById("corrige");

    zone.innerHTML=
        "<strong>👨‍🏫 Corrigé professeur</strong><br><br>"+
        exerciceActuel.corrige;

    zone.style.display="block";
}

function reinitialiser(){

    if(!exerciceActuel)return;

    if(confirm("Réinitialiser cet exercice ?")){

        construireTableau();

        document.getElementById("corrige").style.display="none";
    }
}

function fermerExercice(){

    document.getElementById("zoneExercice").style.display="none";
}

function imprimer(){

    window.print();
}

afficherListe();

</script></body>
